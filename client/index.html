<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YourMine — Dispute Shield</title>

    <!-- PWA & Favicon Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dispute Shield" />

    <!-- Android / Chrome Theme Color -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <style>
      /* Animated Splash Screen */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: #0b0f19;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-logo {
        width: 130px;
        height: 130px;
        border-radius: 24px;
        box-shadow: 0 0 35px rgba(220, 38, 38, 0.45), 0 0 70px rgba(234, 88, 12, 0.25);
        animation: splash-pulse 2s infinite ease-in-out;
      }
      .splash-title {
        margin-top: 24px;
        color: #ffffff;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-align: center;
      }
      .splash-sub {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 13px;
        font-weight: 500;
      }
      .splash-loader {
        margin-top: 28px;
        width: 140px;
        height: 4px;
        background: #1e293b;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .splash-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(90deg, #dc2626, #f97316);
        border-radius: 999px;
        animation: splash-bar 1.2s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 15px rgba(220, 38, 38, 0.4));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 25px rgba(234, 88, 12, 0.6));
        }
      }
      @keyframes splash-bar {
        0% { left: -50%; width: 30%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #f8fafc;">
    <!-- Splash Screen shown during launch on iOS / Android / Desktop -->
    <div id="splash-screen">
      <div class="splash-logo-container">
        <img src="/icon-192.png" alt="YourMine Logo" class="splash-logo" />
      </div>
      <div class="splash-title">your<span style="color: #ef4444;">mine</span> Dispute Shield</div>
      <div class="splash-sub">Juridisch Verweer & Huurrecht Engine</div>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker & Dismiss Splash Screen -->
    <script>
      // Dismiss Splash after React mount or max 1.2 seconds
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 500);
          }
        }, 800);
      });

      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
